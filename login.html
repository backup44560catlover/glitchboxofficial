<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | GlitchBoxOfficial</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #070711;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: #11111f;
    border: 1px solid #9b59ff;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 0 35px rgba(155, 89, 255, .2);
}

.logo {
    text-align: center;
    color: #9b59ff;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.tagline {
    text-align: center;
    color: #888;
    margin-bottom: 28px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #ddd;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border-radius: 9px;
    border: 1px solid #332344;
    background: #191927;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #9b59ff;
}

button {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #9b59ff;
    background: #7c3aed;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}

button:hover {
    background: #9b59ff;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.google {
    background: #171126;
}

.forgot {
    display: block;
    text-align: right;
    color: #c084fc;
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 18px;
    cursor: pointer;
}

.message {
    display: none;
    margin-top: 10px;
    padding: 12px;
    border-radius: 8px;
    background: #191927;
    border: 1px solid #332344;
    color: #ddd;
    text-align: center;
    font-size: 14px;
}

.links {
    text-align: center;
    margin-top: 18px;
    line-height: 1.8;
}

.links a {
    color: #c084fc;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        🎮 GlitchBoxOfficial
    </div>

    <div class="tagline">
        Enter The Glitch. Own The Game.
    </div>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <div
            class="forgot"
            onclick="forgotPassword()"
        >
            Forgot password?
        </div>

        <button
            id="loginButton"
            type="submit"
        >
            🔐 Login
        </button>

    </form>

    <button
        class="google"
        onclick="googleLogin()"
    >
        🌐 Continue with Google
    </button>

    <div
        id="message"
        class="message"
    ></div>

    <div class="links">

        <div>
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>

        <div>
            <a href="index.html">← Back to GlitchBox</a>
        </div>

    </div>

</div>


<script>

/* =====================================
   GLITCHBOX SUPABASE CONNECTION
===================================== */

const SUPABASE_URL =
"https://syjnlgxghgwvqrwtthmr.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5am5sZ3hnaGd3dnFyd3R0aG1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NzExOTcsImV4cCI6MjA5NjM0NzE5N30._TwjJTxXP3wPm-SXnCrvbsVoC0TWaQLt_Mi5UHaWWFI";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================
   MESSAGE
===================================== */

function showMessage(text) {

    const box =
        document.getElementById("message");

    box.textContent = text;
    box.style.display = "block";

}


/* =====================================
   LOGIN
===================================== */

document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const button =
        document.getElementById("loginButton");


    if (!email || !password) {

        showMessage(
            "Please enter your email and password."
        );

        return;
    }


    button.disabled = true;
    button.textContent = "Signing in...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


        if (error) {
            throw error;
        }


        if (!data || !data.session) {

            throw new Error(
                "Supabase did not create a login session."
            );

        }


        localStorage.setItem(
            "gb_email",
            email
        );


        showMessage(
            "✅ Login successful!"
        );


        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 700);


    } catch (error) {

        console.error(
            "GlitchBox login error:",
            error
        );


        let errorText =
            error.message ||
            "Login failed.";


        if (
            errorText
            .toLowerCase()
            .includes("invalid login credentials")
        ) {

            errorText =
                "❌ Incorrect email or password.";

        }


        showMessage(errorText);


        button.disabled = false;
        button.textContent = "🔐 Login";

    }

});


/* =====================================
   FORGOT PASSWORD
===================================== */

async function forgotPassword() {

    const email =
        prompt(
            "Enter the email for your GlitchBox account:"
        );


    if (!email) {
        return;
    }


    try {

        const {
            error
        } =
        await supabaseClient.auth
        .resetPasswordForEmail(
            email.trim(),
            {
                redirectTo:
                    window.location.origin +
                    "/settings.html"
            }
        );


        if (error) {
            throw error;
        }


        alert(
            "✅ Password reset email sent."
        );


    } catch (error) {

        alert(
            "❌ Password reset failed:\n\n" +
            error.message
        );

    }

}


/* =====================================
   GOOGLE LOGIN
===================================== */

async function googleLogin() {

    try {

        const {
            error
        } =
        await supabaseClient.auth
        .signInWithOAuth({

            provider: "google",

            options: {
                redirectTo:
                    window.location.origin +
                    "/index.html"
            }

        });


        if (error) {
            throw error;
        }


    } catch (error) {

        showMessage(
            "Google login failed: " +
            error.message
        );

    }

}


/* =====================================
   CHECK EXISTING SESSION
===================================== */

async function checkSession() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {
            console.error(error);
            return;
        }


        if (data.session) {

            showMessage(
                "✅ You are already signed in."
            );

        }

    } catch (error) {

        console.error(error);

    }

}


/* =====================================
   START
===================================== */

checkSession();

</script>

</body>
</html>
