<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlitchBoxOfficial - Safe Call</title>
    <style>
        :root {
            --bg-black: #07070b;
            --panel-dark: #11111d;
            --card-bg: #19192b;
            --purple-main: #8a2be2;
            --purple-bright: #b565ff;
            --purple-glow: rgba(138, 43, 226, 0.4);
            --accent-green: #00e676;
            --accent-yellow: #ffea00;
            --accent-red: #ff1744;
            --text-white: #ffffff;
            --text-gray: #b0b0c8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-dark);
            padding: 15px 25px;
            border-radius: 14px;
            border: 2px solid var(--purple-main);
            box-shadow: 0 0 18px var(--purple-glow);
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: var(--purple-main);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--purple-bright);
            letter-spacing: 1px;
        }

        .status-pill {
            background: var(--card-bg);
            border: 1px solid var(--purple-bright);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--accent-green);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 850px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-dark);
            border: 2px solid #26263d;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            color: var(--purple-bright);
            border-bottom: 1px solid #2b2b45;
            padding-bottom: 10px;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .toggle-row:hover {
            border-color: var(--purple-main);
        }

        .toggle-row input {
            width: 20px;
            height: 20px;
            accent-color: var(--purple-bright);
            cursor: pointer;
        }

        .pin-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pin-box input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--purple-main);
            background: var(--bg-black);
            color: var(--text-white);
            font-size: 1rem;
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-purple {
            background: var(--purple-main);
            color: white;
        }

        .btn-purple:hover:not(:disabled) {
            background: var(--purple-bright);
            box-shadow: 0 0 15px var(--purple-glow);
        }

        .btn-green {
            background: var(--accent-green);
            color: #000;
        }

        .btn-red {
            background: var(--accent-red);
            color: white;
        }

        .btn-dark {
            background: #282840;
            color: white;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .video-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            min-height: 300px;
        }

        .feed-card {
            background: #050508;
            border: 2px solid var(--purple-main);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 260px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: none;
        }

        .avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--purple-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 10px;
            box-shadow: 0 0 20px var(--purple-glow);
        }

        .feed-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--purple-bright);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .listen-alert {
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid var(--purple-bright);
            color: var(--purple-bright);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .test-bar {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed var(--purple-bright);
        }

        .test-bar input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #3a3a5c;
            background: var(--bg-black);
            color: white;
        }

        .log-console {
            background: #050508;
            border: 1px solid #2b2b45;
            border-radius: 10px;
            padding: 12px;
            height: 160px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-info { color: var(--text-gray); }
        .log-warn { color: var(--accent-yellow); }
        .log-danger { color: var(--accent-red); font-weight: bold; }
        .log-success { color: var(--accent-green); }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 10, 0.94);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: var(--panel-dark);
            border: 2px solid var(--purple-bright);
            border-radius: 16px;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px var(--purple-glow);
        }

        .modal-box h2 {
            color: var(--purple-bright);
            margin-bottom: 12px;
        }

        .report-details {
            background: var(--bg-black);
            border: 1px solid var(--accent-red);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin: 15px 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">🛡️</div>
            <div>
                <h1>GLITCHBOX // SAFE CALL</h1>
                <small style="color: var(--text-gray);">Parent-Controlled Voice & Video Hub</small>
            </div>
        </div>
        <div class="status-pill" id="topStatus">● SYSTEM READY</div>
    </header>

    <div class="main-layout">
        <aside class="panel">
            <div class="panel-title">🔒 Parent Control Panel</div>
            
            <label class="toggle-row">
                <span>🎤 Allow Voice Calling</span>
                <input type="checkbox" id="chkVoice" checked>
            </label>

            <label class="toggle-row">
                <span>📷 Allow Camera Calling</span>
                <input type="checkbox" id="chkCamera" checked>
            </label>
