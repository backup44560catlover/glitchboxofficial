<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | GlitchBox</title>

<link rel="stylesheet" href="css/styles.css">
<script src="js/app.js" defer></script>

<style>

.signup-box{

width:450px;
max-width:95%;

margin:60px auto;

background:#131325;

padding:35px;

border-radius:20px;

box-shadow:0 0 25px rgba(124,58,237,.35);

}

.logo{

text-align:center;

font-size:40px;

font-weight:bold;

color:#c084fc;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#d8b4fe;

margin-bottom:30px;

}

input{

width:100%;

padding:15px;

margin-bottom:15px;

border:none;

border-radius:12px;

background:#1b1b30;

color:white;

font-size:16px;

}

button{

width:100%;

padding:15px;

background:#7c3aed;

color:white;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

button:hover{

background:#8b5cf6;

}

.links{

margin-top:20px;

text-align:center;

}

.links a{

color:#c084fc;

text-decoration:none;

}

</style>

</head>

<body>

<div class="signup-box">

<div class="logo">

🎮 GLITCHBOX

</div>

<div class="subtitle">

Create Your Account

</div>

<form id="signupForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirm"
placeholder="Confirm Password"
required>

<button type="submit">

Create Account

</button>

</form>

<div class="links">

Already have an account?

<br><br>

<a href="login.html">

Login

</a>

</div>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit",function(e){

e.preventDefault();

const password=document.getElementById("password").value;
const confirm=document.getElementById("confirm").value;

if(password!==confirm){

alert("Passwords do not match.");

return;

}

alert("Account created! (Temporary demo)");

window.location.href="login.html";

});

</script>

</body>

</html>
