<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlitchBox Login</title>

<link rel="stylesheet" href="css/styles.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- GlitchBox Scripts -->
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js" defer></script>

<style>

body{
background:#070714;
}

.login-box{
width:420px;
max-width:95%;
margin:80px auto;
background:#131325;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(124,58,237,.35);
}

.logo{
font-size:42px;
font-weight:bold;
color:#c084fc;
margin-bottom:15px;
}

.subtitle{
color:#d8b4fe;
margin-bottom:30px;
}

input{
width:100%;
padding:15px;
margin-bottom:18px;
border:none;
border-radius:12px;
background:#1b1b30;
color:white;
font-size:16px;
}

input:focus{
outline:2px solid #7c3aed;
}

button{
width:100%;
padding:15px;
background:#7c3aed;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.25s;
}

button:hover{
background:#8b5cf6;
transform:translateY(-2px);
}

.links{
margin-top:20px;
}

.links a{
color:#c084fc;
text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
🎮 GLITCHBOX
</div>

<div class="subtitle">
Enter the Glitch. Own the Game.
</div>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<div class="links">

<br>

<a href="signup.html">
Create Account
</a>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e){

e.preventDefault();

const username=document.getElementById("username").value;

localStorage.setItem("gb_username",username);

if(localStorage.getItem("gb_device")==null){

window.location.href="device-setup.html";

}else{

window.location.href="index.html";

}

});

</script>

</body>

</html>
