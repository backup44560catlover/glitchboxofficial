<!DOCTYPE html><html>
<head>
<title>GlitchBox Owner Dashboard</title><style>
body{
  margin:0;
  background:black;
  color:#9b59ff;
  font-family:Arial,sans-serif;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  border-right:2px solid #9b59ff;
  padding-top:20px;
}

.sidebar button{
  width:180px;
  margin:10px;
  padding:10px;
  background:black;
  color:#9b59ff;
  border:2px solid #9b59ff;
  cursor:pointer;
}

.content{
  margin-left:240px;
  padding:20px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}
</style></head><body><div class="sidebar">
<h2>Owner Panel</h2><button onclick="showSection('users')">Users</button>
<button onclick="showSection('sponsors')">Sponsors</button>
<button onclick="showSection('announcements')">Announcements</button>
<button onclick="showSection('reports')">Reports</button>
<button onclick="showSection('settings')">Settings</button>
<button onclick="showSection('stats')">Statistics</button>

</div><div class="content"><div id="users" class="section active">
<h1>Users</h1>
<p>Total Users: Coming Soon</p>
</div><div id="sponsors" class="section">
<h1>Sponsors</h1>
<p>Sponsor Management Coming Soon</p>
</div><div id="announcements" class="section">
<h1>Announcements</h1>
<p>Announcement System Coming Soon</p>
</div><div id="reports" class="section">
<h1>Reports</h1>
<p>Reports Coming Soon</p>
</div><div id="settings" class="section">
<h1>Settings</h1>
<p>Website Settings Coming Soon</p>
</div><div id="stats" class="section">
<h1>Statistics</h1>
<p>Stats Coming Soon</p>
</div></div><script>
function showSection(id){
  const sections = document.querySelectorAll(".section");

  sections.forEach(section=>{
    section.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}
</script></body>
</html>
