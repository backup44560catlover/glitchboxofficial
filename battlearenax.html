<!DOCTYPE html><html>
<head>
<title>Battle Arena X</title><style>
body{
    background:black;
    color:#9b59ff;
    font-family:Arial,sans-serif;
    text-align:center;
}

.card{
    border:2px solid #9b59ff;
    border-radius:10px;
    padding:20px;
    margin:20px auto;
    max-width:500px;
}

button{
    background:black;
    color:#9b59ff;
    border:2px solid #9b59ff;
    padding:12px 20px;
    margin:5px;
    cursor:pointer;
}
</style></head><body><h1>⚔️ Battle Arena X</h1><div class="card"><h2>❤️ HP: <span id="playerHp">100</span></h2><h2>⭐ Level: <span id="level">1</span></h2><h2>✨ XP: <span id="xp">0</span></h2><h2>🪙 Coins: <span id="coins">0</span></h2><h2 id="monsterName">👹 Slime</h2><h2>Monster HP: <span id="monsterHp">50</span></h2><p id="message">A wild monster appeared!</p><button onclick="attack()">⚔️ Attack</button>

<button onclick="specialAttack()">🔥 Special</button>

<button onclick="heal()">❤️ Heal</button>

</div><a href="games.html">
<button>🏠 Back To Games</button>
</a><script>

let playerHp = 100;
let coins = 0;
let xp = 0;
let level = 1;

let monsters = [
  {name:"👹 Slime", hp:50},
  {name:"👺 Goblin", hp:75},
  {name:"🧟 Zombie", hp:100},
  {name:"🐺 Wolf", hp:125},
  {name:"🐉 Dragon", hp:200}
];

let currentMonster;
let monsterHp;

function newMonster(){

  currentMonster =
  monsters[Math.floor(Math.random()*monsters.length)];

  monsterHp = currentMonster.hp;

  document.getElementById("monsterName").innerText =
  currentMonster.name;

  update();
}

function update(){

  document.getElementById("playerHp").innerText =
  playerHp;

  document.getElementById("monsterHp").innerText =
  monsterHp;

  document.getElementById("coins").innerText =
  coins;

  document.getElementById("xp").innerText =
  xp;

  document.getElementById("level").innerText =
  level;
}

function monsterTurn(){

  if(monsterHp <= 0) return;

  let damage =
  Math.floor(Math.random()*12)+4;

  playerHp -= damage;

  if(playerHp < 0) playerHp = 0;

  update();

  if(playerHp === 0){

    document.getElementById("message").innerText =
    "💀 Game Over";

  }
}

function victory(){

  coins += 25;
  xp += 20;

  if(xp >= level * 50){

    xp = 0;
    level++;
    playerHp = 100;

    document.getElementById("message").innerText =
    "⭐ LEVEL UP! You are now Level " + level;

  } else {

    document.getElementById("message").innerText =
    "🏆 Victory! +25 Coins +20 XP";

  }

  update();

  setTimeout(newMonster,1500);
}

function attack(){

  if(playerHp <= 0) return;

  let damage =
  Math.floor(Math.random()*15)+8;

  monsterHp -= damage;

  if(monsterHp < 0) monsterHp = 0;

  update();

  if(monsterHp === 0){

    victory();
    return;

  }

  monsterTurn();
}

function specialAttack(){

  if(playerHp <= 0) return;

  let damage =
  Math.floor(Math.random()*30)+10;

  monsterHp -= damage;

  if(monsterHp < 0) monsterHp = 0;

  update();

  if(monsterHp === 0){

    victory();
    return;

  }

  monsterTurn();
}

function heal(){

  if(playerHp <= 0) return;

  playerHp += 15;

  if(playerHp > 100)
    playerHp = 100;

  update();

  monsterTurn();
}

newMonster();

</script></body>
</html>
