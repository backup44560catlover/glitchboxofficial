<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - GlitchBox</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#070714,#120022,#2b0052,#4b0082);
color:white;
}

.container{
width:420px;
background:#131325;
padding:35px;
border-radius:25px;
border:1px solid #222;
box-shadow:0 0 25px rgba(124,58,237,.45);
}

.logo{
font-size:40px;
font-weight:bold;
text-align:center;
color:#a855ff;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#d8b4fe;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:12px;
border:1px solid #333;
background:#0d0d18;
color:white;
font-size:16px;
}

input:focus{
outline:none;
border-color:#7c3aed;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#7c3aed;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#8b5cf6;
}

.links{
margin-top:20px;
text-align:center;
}

.links a{
color:#c084fc;
text-decoration:none;
}

.footer{
margin-top:20px;
text-align:center;
color:#777;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
GLITCHBOX
</div>

<div class="subtitle">
Create Your Account
</div>

<form onsubmit="signup(event)">

<input type="text" placeholder="Username" required>

<input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button type="submit">
Create Account
</button>

</form>

<div class="links">

Already have an account?

<br><br>

<a href="login.html">Login Here</a>

</div>

<div class="footer">

© 2026 GlitchBox

</div>

</div>

<script>

function signup(event){

event.preventDefault();

alert("Account created successfully!");

window.location.href="login.html";

}

</script>

</body>
</html>
