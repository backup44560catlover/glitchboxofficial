
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlitchBoxOfficial | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

.login-container {
  width: 100%;
  max-width: 420px;
  padding: 32px;
  background: #141414;
  border: 1px solid #9b59ff;
  border-radius: 16px;
  box-shadow: 0 0 25px rgba(155,89,255,.15);
}

.logo {
  text-align: center;
  color: #9b59ff;
  font-size: 27px;
  font-weight: bold;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 28px;
}

h2 {
  text-align: center;
  color: #9b59ff;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #ddd;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #59328a;
  border-radius: 8px;
  background: #080808;
  color: white;
  outline: none;
}

input:focus {
  border-color: #9b59ff;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 16px;
  border: 1px solid #9b59ff;
  border-radius: 8px;
  background: #080808;
  color: #c69cff;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #281443;
}

.google-button {
  background: white;
  color: #222;
  border: none;
}

.google-button:hover {
  background: #e9e9e9;
}

.primary-button {
  background: #9b59ff;
  color: #080808;
}

.links {
  text-align: center;
  margin-top: 22px;
  line-height: 2;
}

a {
  color: #b98aff;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: #888;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  background: #444;
  flex: 1;
}

#message {
  margin-top: 15px;
  text-align: center;
  color: #ff8888;
  overflow-wrap: anywhere;
}

.hidden {
  display: none;
}

.small {
  font-size: 13px;
  color: #999;
  text-align: center;
}
</style>
</head>

<body>

<div class="login-container">

  <div class="logo">🎮 GlitchBoxOfficial</div>
  <p class="subtitle">Enter The Glitch. Own The Game.</p>

  <section id="loginSection">
    <h2>Welcome Back</h2>

    <button class="google-button" onclick="googleLogin()">
      🌐 Continue with Google
    </button>

    <div class="divider">OR</div>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button class="primary-button" type="submit">
        Log In
      </button>
    </form>

    <div class="links">
      <a href="#" onclick="forgotPassword(event)">
        Forgot Password?
      </a>
      <br>
      Don't have an account?
      <a href="register.html">Create Account</a>
      <br>
      <a href="index.html">Back to Home</a>
    </div>
  </section>

  <section id="resetSection" class="hidden">
    <h2>Reset Password</h2>
    <p class="small">Choose a new password for your account.</p>

    <form id="resetForm">
      <label for="newPassword">New Password</label>
      <input
        id="newPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button class="primary-button" type="submit">
        Save New Password
      </button>
    </form>
  </section>

  <p id="message"></p>

</div>

<script>
const SUPABASE_URL =
  "https://syjnlgxghgwvqrwtthmr.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5am5sZ3hnaGd3dnFyd3R0aG1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NzExOTcsImV4cCI6MjA5NjM0NzE5N30._TwjJTxXP3wPm-SXnCrvbsVoC0TWaQLt_Mi5UHaWWFI";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth: {
      flowType: "pkce",
      detectSessionInUrl: true,
      persistSession: true,
      autoRefreshToken: true
    }
  }
);

const message = document.getElementById("message");
let recoveryMode = false;
let checkingAccount = false;

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "#8cffad" : "#ff8888";
}

async function googleLogin() {
  showMessage("Connecting to Google...", true);

  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + "/login.html"
    }
  });

  if (error) {
    showMessage(error.message);
  }
}

document.getElementById("loginForm").addEventListener(
  "submit",
  async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    showMessage("Signing in...", true);

    const { error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showMessage(error.message);
    }
  }
);

async function forgotPassword(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("Enter your email address first.");
    return;
  }

  showMessage("Sending password reset email...", true);

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/login.html"
    });

  if (error) {
    showMessage(error.message);
  } else {
    showMessage("Password reset email sent. Check your inbox.", true);
  }
}

document.getElementById("resetForm").addEventListener(
  "submit",
  async function(event) {
    event.preventDefault();

    const password = document.getElementById("newPassword").value;

    showMessage("Updating password...", true);

    const { error } = await supabaseClient.auth.updateUser({
      password
    });

    if (error) {
      showMessage(error.message);
      return;
    }

    recoveryMode = false;
    document.getElementById("resetSection").classList.add("hidden");
    document.getElementById("loginSection").classList.remove("hidden");

    showMessage("Password updated successfully!", true);
  }
);

async function checkAccount(session) {
  if (!session || checkingAccount) return;

  checkingAccount = true;
  showMessage("Checking your account...", true);

  try {
    const { data: profile, error } = await supabaseClient
      .from("profiles")
      .select("is_banned, ban_reason")
      .eq("id", session.user.id)
      .maybeSingle();

    if (error || !profile) {
      showMessage("Could not verify your account status. Please contact support.");
      return;
    }

    if (profile.is_banned) {
      showMessage(
        "Your account is banned. Reason: " +
        (profile.ban_reason || "No reason provided.") +
        " Please contact GlitchBoxOfficial support."
      );
      return;
    }

    window.location.replace("games.html");

  } finally {
    checkingAccount = false;
  }
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    recoveryMode = true;
    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("resetSection").classList.remove("hidden");
    showMessage("Enter your new password.", true);
    return;
  }

  if (event === "SIGNED_IN" && !recoveryMode) {
    checkAccount(session);
  }
});

// Handle an existing session when the login page opens.
(async function initializeLogin() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    showMessage("Unable to check your login session.");
    return;
  }

  if (data.session && !recoveryMode) {
    await checkAccount(data.session);
  }
})();
</script>

</body>
</html>
