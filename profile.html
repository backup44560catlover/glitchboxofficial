<style>

.profile-banner{

background:linear-gradient(135deg,#2b0052,#4b0082);

padding:50px;

border-radius:25px;

text-align:center;

margin-bottom:30px;

}

.avatar{

width:150px;
height:150px;

margin:auto;

border-radius:50%;

background:#222;

display:flex;

justify-content:center;

align-items:center;

font-size:70px;

border:5px solid #7c3aed;

}

.username{

font-size:42px;

margin-top:20px;

font-weight:bold;

}

.rank{

font-size:22px;

margin-top:10px;

color:#d8b4fe;

}

.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;

}

.stat{

background:#131325;

padding:25px;

border-radius:20px;

text-align:center;

}

.stat h2{

color:#c084fc;

margin-bottom:10px;

}

</style>

</head>
