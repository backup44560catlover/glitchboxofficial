<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Strike | GlitchBox</title>

<link rel="icon" type="image/png" href="glitchbox-logo.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #05050c;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.game-header {
    height: 70px;
    background: #0d0d1b;
    border-bottom: 1px solid #7135a5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.game-title {
    color: #b45cff;
    font-size: 24px;
    font-weight: bold;
}

.stats {
    display: flex;
    gap: 15px;
}

.stat {
    background: #171326;
    border: 1px solid #6135a0;
    padding: 8px 12px;
    border-radius: 8px;
}

#game {
    display: block;
    width: 100vw;
    height: calc(100vh - 70px);
    background:
        radial-gradient(circle at center, #17102b 0%, #05050c 65%);
}

.controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: #aaa;
    font-size: 13px;
}

.message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(10, 5, 20, .95);
    border: 1px solid #a855ff;
    border-radius: 18px;
    padding: 30px;
    display: none;
    z-index: 10;
}

.message h1 {
    color: #c084fc;
    margin-bottom: 10px;
}

.message button {
    margin-top: 18px;
    padding: 12px 20px;
    border-radius: 9px;
    border: 1px solid #a855ff;
    background: #6d28d9;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<header class="game-header">

    <div class="game-title">
        ⚡ Cyber Strike
    </div>

    <div class="stats">
        <div class="stat">
            ❤️ <span id="health">100</span>
        </div>

        <div class="stat">
            🪙 <span id="gc">0</span>
        </div>

        <div class="stat">
            🎯 Level <span id="level">1</span>
        </div>
    </div>

</header>

<canvas id="game"></canvas>

<div class="controls">
    WASD / Arrow Keys = Move &nbsp; | &nbsp;
    Mouse / Space = Shoot
</div>

<div class="message" id="gameOver">

    <h1>💥 CYBER STRIKE OVER</h1>

    <p>
        You survived to level
        <strong id="finalLevel">1</strong>
    </p>

    <p>
        🪙 GC earned:
        <strong id="finalGC">0</strong>
    </p>

    <button onclick="restartGame()">
        🔄 Play Again
    </button>

    <br><br>

    <button onclick="location.href='index.html'">
        🏠 Back to GlitchBox
    </button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 70;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   GAME STATE
========================= */

let keys = {};

let mouse = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    down: false
};

let player;

let bullets = [];
let enemies = [];

let health = 100;
let gc = 0;
let level = 1;

let enemyTimer = 0;
let gameRunning = true;


/* =========================
   PLAYER
========================= */

function createPlayer() {

    player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        size: 18,
        speed: 5
    };

}


/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown", function(e) {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        shoot();
    }

});

window.addEventListener("keyup", function(e) {

    keys[e.key.toLowerCase()] = false;

});


/* =========================
   MOUSE
========================= */

canvas.addEventListener("mousemove", function(e) {

    const rect = canvas.getBoundingClientRect();

    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

});

canvas.addEventListener("mousedown", function() {

    mouse.down = true;
    shoot();

});

window.addEventListener("mouseup", function() {

    mouse.down = false;

});


/* =========================
   SHOOT
========================= */

let lastShot = 0;

function shoot() {

    if (!gameRunning) return;

    const now = Date.now();

    if (now - lastShot < 180) return;

    lastShot = now;

    const dx = mouse.x - player.x;
    const dy = mouse.y - player.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance === 0) return;

    bullets.push({
        x: player.x,
        y: player.y,
        vx: dx / distance * 9,
        vy: dy / distance * 9,
        size: 5
    });

}


/* =========================
   ENEMIES
========================= */

function spawnEnemy() {

    const side = Math.floor(Math.random() * 4);

    let x;
    let y;

    if (side === 0) {
        x = Math.random() * canvas.width;
        y = -30;
    }

    if (side === 1) {
        x = canvas.width + 30;
        y = Math.random() * canvas.height;
    }

    if (side === 2) {
        x = Math.random() * canvas.width;
        y = canvas.height + 30;
    }

    if (side === 3) {
        x = -30;
        y = Math.random() * canvas.height;
    }

    enemies.push({
        x: x,
        y: y,
        size: 17,
        speed: 1.2 + level * 0.15,
        health: 1
    });

}


/* =========================
   UPDATE
========================= */

function update() {

    if (!gameRunning) return;


    /* PLAYER MOVEMENT */

    if (keys["w"] || keys["arrowup"]) {
        player.y -= player.speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        player.y += player.speed;
    }

    if (keys["a"] || keys["arrowleft"]) {
        player.x -= player.speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.x += player.speed;
    }


    /* KEEP PLAYER ON SCREEN */

    player.x = Math.max(
        player.size,
        Math.min(canvas.width - player.size, player.x)
    );

    player.y = Math.max(
        player.size,
        Math.min(canvas.height - player.size, player.y)
    );


    /* BULLETS */

    bullets.forEach(bullet => {

        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

    });

    bullets = bullets.filter(bullet =>
        bullet.x > -20 &&
        bullet.x < canvas.width + 20 &&
        bullet.y > -20 &&
        bullet.y < canvas.height + 20
    );


    /* SPAWN ENEMIES */

    enemyTimer++;

    const spawnRate =
        Math.max(25, 80 - level * 5);

    if (enemyTimer > spawnRate) {

        spawnEnemy();

        enemyTimer = 0;

    }


    /* ENEMIES */

    enemies.forEach(enemy => {

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance > 0) {

            enemy.x +=
                dx / distance * enemy.speed;

            enemy.y +=
                dy / distance * enemy.speed;

        }


        /* DAMAGE PLAYER */

        if (distance < player.size + enemy.size) {

            health -= 0.5;

            updateStats();

        }

    });


    /* BULLET COLLISIONS */

    bullets.forEach((bullet, bulletIndex) => {

        enemies.forEach((enemy, enemyIndex) => {

            const dx = bullet.x - enemy.x;
            const dy = bullet.y - enemy.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance < bullet.size + enemy.size) {

                bullets.splice(bulletIndex, 1);

                enemy.health--;

                if (enemy.health <= 0) {

                    enemies.splice(enemyIndex, 1);

                    gc += 10;

                    if (gc % 100 === 0) {
                        level++;
                    }

                    updateStats();

                }

            }

        });

    });


    /* GAME OVER */

    if (health <= 0) {

        health = 0;

        gameOver();

    }

}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle = "#171329";
    ctx.lineWidth = 1;

    const gridSize = 45;

    for (
        let x = 0;
        x < canvas.width;
        x += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);

        ctx.stroke();

    }

    for (
        let y = 0;
        y < canvas.height;
        y += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);

        ctx.stroke();

    }


    /* PLAYER */

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.size,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#a855ff";
    ctx.fill();

    ctx.strokeStyle = "#e9d5ff";
    ctx.lineWidth = 2;
    ctx.stroke();


    /* PLAYER AIM */

    const aimAngle =
        Math.atan2(
            mouse.y - player.y,
            mouse.x - player.x
        );

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        player.x + Math.cos(aimAngle) * 30,
        player.y + Math.sin(aimAngle) * 30
    );

    ctx.strokeStyle = "#d8b4fe";
    ctx.lineWidth = 4;
    ctx.stroke();


    /* BULLETS */

    bullets.forEach(bullet => {

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffffff";
        ctx.fill();

    });


    /* ENEMIES */

    enemies.forEach(enemy => {

        ctx.beginPath();

        ctx.arc(
            enemy.x,
            enemy.y,
            enemy.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ef4444";
        ctx.fill();

        ctx.strokeStyle = "#ffb4b4";
        ctx.lineWidth = 2;
        ctx.stroke();

    });

}


/* =========================
   STATS
========================= */

function updateStats() {

    document.getElementById("health")
        .textContent = Math.floor(health);

    document.getElementById("gc")
        .textContent = gc;

    document.getElementById("level")
        .textContent = level;

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    gameRunning = false;

    document.getElementById("finalLevel")
        .textContent = level;

    document.getElementById("finalGC")
        .textContent = gc;

    document.getElementById("gameOver")
        .style.display = "block";

}


/* =========================
   RESTART
========================= */

function restartGame() {

    health = 100;
    gc = 0;
    level = 1;

    bullets = [];
    enemies = [];

    enemyTimer = 0;

    gameRunning = true;

    document.getElementById("gameOver")
        .style.display = "none";

    createPlayer();
    updateStats();

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);

}


createPlayer();
updateStats();
gameLoop();

</script>

</body>
  </html>
