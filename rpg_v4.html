<!DOCTYPE html><html>
<head>
<title>Battle Arena X RPG V4</title><style>

body{
background:#050505;
color:#00ffff;
font-family:Arial,sans-serif;
text-align:center;
margin:0;
padding:20px;
}

.panel{
border:2px solid #00ffff;
border-radius:12px;
padding:15px;
margin:15px auto;
max-width:800px;
background:#111;
}

button{
background:#111;
color:#00ffff;
border:2px solid #00ffff;
padding:10px 15px;
margin:5px;
cursor:pointer;
border-radius:8px;
}

button:hover{
background:#00ffff;
color:black;
}

</style></head><body><h1>⚡ BATTLE ARENA X RPG V4 ⚡</h1><div class="panel"><h2>👤 Player</h2><p>❤️ HP: <span id="hp">100</span></p><p>⭐ Level: <span id="level">1</span></p><p>✨ XP: <span id="xp">0</span></p><p>🪙 Coins: <span id="coins">0</span></p></div><div class="panel"><h2>🗺️ World Map</h2><button>🏘️ Village</button>

<button>🌲 Forest</button>

<button>🕷️ Cave</button>

<button>🏔️ Mountain</button>

<button>🔥 Volcano</button>

<button>🐉 Dragon Castle</button>

</div><div class="panel"><h2>🎒 Inventory</h2><p>🧪 Potions: 3</p><p>⚔️ Weapon: Wood Sword</p><p>🛡️ Armor: Cloth Armor</p><p>💎 Loot: None</p></div><div class="panel"><h2>📜 Quests</h2><p>Defeat 3 Monsters</p></div><div class="panel"><h2>👹 Monster Area</h2><p id="monster">👹 Slime (50 HP)</p><p id="message">A wild monster appears...</p><button onclick="attack()">⚔️ Attack</button>

<button>🔥 Special</button>

<button>❤️ Heal</button>

<button>🧪 Potion</button>

</div><div class="panel"><h2>🪙 Shop</h2><button>Potion (25)</button>

<button>Iron Sword (100)</button>

<button>Iron Armor (100)</button>

</div><script>

let hp = 100;
let level = 1;
let xp = 0;
let coins = 0;

let monsterHp = 50;

function update(){

document.getElementById("hp").innerText = hp;
document.getElementById("level").innerText = level;
document.getElementById("xp").innerText = xp;
document.getElementById("coins").innerText = coins;

document.getElementById("monster").innerText =
"👹 Slime (" + monsterHp + " HP)";

}

function attack(){

monsterHp -= 10;

if(monsterHp <= 0){

monsterHp = 50;

xp += 20;
coins += 25;

document.getElementById("message").innerText =
"🏆 Monster Defeated! +25 Coins +20 XP";

if(xp >= 100){

xp = 0;
level++;

document.getElementById("message").innerText =
"⭐ LEVEL UP!";

}

}else{

hp -= 5;

document.getElementById("message").innerText =
"⚔️ You attacked the monster!";

}

update();

}

update();

</body>
</html>
</script></body>
