<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | GlitchBoxOfficial</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#070711;
    color:white;
    min-height:100vh;
    transition:.25s;
}

body.light{
    background:#f2f2f7;
    color:#111;
}

nav{
    position:fixed;
    left:0;
    top:0;
    width:235px;
    height:100vh;
    background:#0d0d1b;
    border-right:1px solid #302040;
    padding:20px 14px;
    overflow-y:auto;
}

.logo{
    color:#9b59ff;
    font-size:24px;
    font-weight:bold;
}

.tagline{
    color:#777;
    font-size:11px;
    margin:5px 0 20px;
}

nav a{
    display:block;
    color:#ddd;
    text-decoration:none;
    padding:10px;
    border-radius:8px;
    margin:3px 0;
}

nav a:hover,
nav a.active{
    background:#6d28d9;
    color:white;
}

main{
    margin-left:235px;
    padding:30px;
    max-width:1100px;
}

h1{
    color:#c084fc;
    margin-bottom:7px;
}

.subtitle{
    color:#888;
    margin-bottom:25px;
}

.status{
    padding:13px;
    border-radius:10px;
    background:#11111f;
    border:1px solid #392b50;
    margin-bottom:20px;
    color:#aaa;
}

.section{
    background:#11111f;
    border:1px solid #292940;
    border-radius:16px;
    margin-bottom:20px;
    overflow:hidden;
}

.section-title{
    padding:17px;
    color:#d8b4fe;
    font-size:19px;
    font-weight:bold;
    border-bottom:1px solid #292940;
}

.setting{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:18px;
    border-bottom:1px solid #20202f;
}

.setting:last-child{
    border-bottom:none;
}

.setting h3{
    font-size:15px;
    margin-bottom:5px;
}

.setting p{
    color:#888;
    font-size:13px;
    line-height:1.4;
}

button,
select,
input{
    background:#171126;
    color:white;
    border:1px solid #9b59ff;
    border-radius:9px;
    padding:10px 14px;
}

button{
    cursor:pointer;
}

button:hover{
    background:#6d28d9;
}

select{
    min-width:160px;
}

input{
    width:230px;
    outline:none;
}

.danger{
    border-color:#ef4444;
}

.danger:hover{
    background:#991b1b;
}

.value{
    color:#c084fc;
    font-weight:bold;
}

.toggle{
    position:relative;
    width:52px;
    height:28px;
    flex-shrink:0;
}

.toggle input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#292940;
    border-radius:30px;
    cursor:pointer;
}

    content:"";
    position:absolute;
    width:22px;
    height:22px;
