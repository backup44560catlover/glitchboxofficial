
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends | GlitchBoxOfficial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#08080c;color:#f4edff;font-family:Arial,sans-serif}
header,main{max-width:900px;margin:auto}
header{text-align:center;margin-bottom:22px}
h1,h2{color:#b78aff}
.panel{background:#121019;border:1px solid #7040a8;border-radius:14px;padding:18px;margin:16px 0}
input{width:100%;padding:13px;margin:8px 0;background:#08080c;color:white;border:1px solid #7040a8;border-radius:8px;font-size:16px}
button,.link{display:inline-block;background:#09090d;color:#c6a5ff;border:1px solid #9b59ff;border-radius:8px;padding:10px 14px;margin:4px 3px 4px 0;font-size:14px;text-decoration:none;cursor:pointer}
button:hover,.link:hover{background:#25143b}
button:disabled{opacity:.5;cursor:wait}
.person{background:#1a1523;border:1px solid #39254f;border-radius:10px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
.muted,.small{color:#bdb4ca}
.small{font-size:13px}
.status{min-height:24px;color:#d7bdff;overflow-wrap:anywhere}
.danger{color:#ffaaaa;border-color:#b34b63}
</style>
</head>
<body>
<header>
  <h1>🎮 GlitchBoxOfficial Friends</h1>
  <p class="muted">Find players. Send requests. Build your crew.</p>
  <a class="link" href="index.html">Home</a>
  <button id="refreshButton">Refresh</button>
  <p id="account" class="muted">Checking login...</p>
</header>

<main>
  <div id="message" class="status" role="status" aria-live="polite"></div>

  <section class="panel">
    <h2>🔎 Find Players</h2>
    <input id="searchInput" maxlength="40"
      placeholder="Search username..." autocomplete="off">
    <button id="searchButton">Search</button>
    <div id="searchResults"></div>
  </section>

  <section class="panel">
    <h2>📨 Incoming Requests</h2>
    <div id="incoming">Loading...</div>
  </section>

  <section class="panel">
    <h2>📤 Sent Requests</h2>
    <div id="outgoing">Loading...</div>
  </section>

  <section class="panel">
    <h2>👥 My Friends</h2>
    <div id="friendsList">Loading...</div>
  </section>
</main>

<script>
"use strict";

const SUPABASE_URL =
  "https://syjnlgxghgwvqrwtthmr.supabase.co";

// Paste your PUBLIC anon/publishable key between the quotes.
// Never use a service_role or secret key in browser code.
const SUPABASE_ANON_KEY = "PASTE_YOUR_PUBLIC_ANON_KEY_HERE";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentUser = null;
let loading = false;

const $ = id => document.getElementById(id);

function say(message) {
  $("message").textContent = message || "";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function empty(id, message) {
  $(id).innerHTML =
    `<p class="muted">${escapeHTML(message)}</p>`;
}

function errorMessage(error) {
  return error?.message || "An unexpected error occurred.";
}

async function getProfiles(ids) {
  const uniqueIds = [...new Set(ids)].filter(Boolean);
  if (!uniqueIds.length) return {};

  const { data, error } = await db
    .from("profiles")
    .select("id,username")
    .in("id", uniqueIds);

  if (error) throw error;

  return Object.fromEntries(
    (data || []).map(profile => [profile.id, profile])
  );
}

async function loadAll() {
  if (loading) return;
  loading = true;
  $("refreshButton").disabled = true;
  say("");

  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    currentUser = data.session?.user || null;

    if (!currentUser) {
      $("account").textContent =
        "Please sign in to use Friends.";

      ["incoming", "outgoing", "friendsList", "searchResults"]
        .forEach(id => empty(id, "Sign in to use this section."));

      return;
    }

    $("account").textContent =
      "Signed in as " + (currentUser.email || "GlitchBox player");

    const [incomingResult, outgoingResult, friendshipResult] =
      await Promise.all([
        db.from("friend_requests")
          .select("id,sender_id,created_at")
          .eq("recipient_id", currentUser.id)
          .eq("status", "pending")
          .order("created_at", { ascending: false }),

        db.from("friend_requests")
          .select("id,recipient_id,created_at")
          .eq("sender_id", currentUser.id)
          .eq("status", "pending")
          .order("created_at", { ascending: false }),

        db.from("friendships")
          .select("user_one,user_two,created_at")
          .or(
            `user_one.eq.${currentUser.id},user_two.eq.${currentUser.id}`
          )
          .order("created_at", { ascending: false })
      ]);

    for (const result of [
      incomingResult, outgoingResult, friendshipResult
    ]) {
      if (result.error) throw result.error;
    }

    const incoming = incomingResult.data || [];
    const outgoing = outgoingResult.data || [];
    const friendships = friendshipResult.data || [];

    const friendIds = friendships.map(row =>
      row.user_one === currentUser.id
        ? row.user_two
        : row.user_one
    );

    const profiles = await getProfiles([
      ...incoming.map(row => row.sender_id),
      ...outgoing.map(row => row.recipient_id),
      ...friendIds
    ]);

    renderIncoming(incoming, profiles);
    renderOutgoing(outgoing, profiles);
    renderFriends(friendIds, profiles);

  } catch (error) {
    say("Couldn't load Friends: " + errorMessage(error));
  } finally {
    loading = false;
    $("refreshButton").disabled = false;
  }
}

function renderIncoming(rows, profiles) {
  if (!rows.length) {
    empty("incoming", "No incoming friend requests.");
    return;
  }

  $("incoming").innerHTML = rows.map(row => {
    const name = profiles[row.sender_id]?.username || "Unknown player";

    return `<div class="person">
      <strong>@${escapeHTML(name)}</strong><div>
        <button data-action="respond" data-id="${row.id}"
          data-accept="true">Accept</button>
        <button class="danger" data-action="respond"
          data-id="${row.id}" data-accept="false">Decline</button>
      </div>
    </div>`;
  }).join("");
}

function renderOutgoing(rows, profiles) {
  if (!rows.length) {
    empty("outgoing", "No pending sent requests.");
    return;
  }

  $("outgoing").innerHTML = rows.map(row => {
    const name =
      profiles[row.recipient_id]?.username || "Unknown player";

    return `<div class="person">
      <strong>@${escapeHTML(name)}</strong>
      <p class="small">Waiting for their response.</p>
      <button class="danger" data-action="cancel"
        data-id="${row.id}">Cancel Request</button>
    </div>`;
  }).join("");
}

function renderFriends(ids, profiles) {
  if (!ids.length) {
    empty("friendsList", "No friends yet. Search for players above!");
    return;
  }

  $("friendsList").innerHTML = ids.map(id => {
    const name = profiles[id]?.username || "Unknown player";

    return `<div class="person">
      <strong>@${escapeHTML(name)}</strong>
      <p class="small">GlitchBoxOfficial friend</p>
    </div>`;
  }).join("");
}

async function searchPlayers() {
  if (!currentUser) {
    say("Please sign in first.");
    return;
  }

  const term = $("searchInput").value.trim().replace(/^@/, "");

  if (term.length < 2) {
    say("Enter at least 2 characters.");
    return;
  }

  $("searchButton").disabled = true;
  say("Searching...");

  try {
    // Escape SQL LIKE wildcard characters in the username search.
    const safeTerm = term.replace(/[\\%_]/g, "\\$&");

    const { data: players, error: searchError } = await db
      .from("profiles")
      .select("id,username")
      .ilike("username", `%${safeTerm}%`)
      .neq("id", currentUser.id)
      .limit(20);

    if (searchError) throw searchError;

    if (!players?.length) {
      empty("searchResults", "No matching players found.");
      say("No matching players found.");
      return;
    }

    const [friendResult, requestResult] = await Promise.all([
      db.from("friendships")
        .select("user_one,user_two")
        .or(
          `user_one.eq.${currentUser.id},user_two.eq.${currentUser.id}`
        ),

      db.from("friend_requests")
        .select("sender_id,recipient_id,status")
        .or(
          `sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`
        )
        .eq("status", "pending")
    ]);

    if (friendResult.error) throw friendResult.error;
    if (requestResult.error) throw requestResult.error;

    const friendIds = new Set(
      (friendResult.data || []).map(row =>
        row.user_one === currentUser.id
          ? row.user_two
          : row.user_one
      )
    );

    const pendingById = new Map(
      (requestResult.data || []).map(row => [
        row.sender_id === currentUser.id
          ? row.recipient_id
          : row.sender_id,
        row
      ])
    );

    $("searchResults").innerHTML = players.map(player => {
      let action = "";

      if (friendIds.has(player.id)) {
        action = `<p class="small">✓ Already friends</p>`;
      } else if (pendingById.has(player.id)) {
        const request = pendingById.get(player.id);

        action = request.recipient_id === currentUser.id
          ? `<p class="small">They sent you a request. Check Incoming Requests.</p>`
          : `<p class="small">Friend request pending.</p>`;
      } else {
        action = `<button data-action="send"
          data-id="${player.id}">Add Friend</button>`;
      }

      return `<div class="person">
        <strong>@${escapeHTML(player.username)}</strong>
        <div>${action}</div>
      </div>`;
    }).join("");

    say(`${players.length} player(s) found.`);

  } catch (error) {
    say("Search failed: " + errorMessage(error));
  } finally {
    $("searchButton").disabled = false;
  }
}

async function sendRequest(recipientId) {
  if (!currentUser || recipientId === currentUser.id) {
    say("Please sign in and select another player.");
    return;
  }

  try {
    const { error } = await db.from("friend_requests").insert({
      sender_id: currentUser.id,
      recipient_id: recipientId,
      status: "pending"
    });

    if (error) {
      if (error.code === "23505") {
        say("A request between these players is already pending.");
        await loadAll();
        await searchPlayers();
        return;
      }
      throw error;
    }

    say("Friend request sent successfully! 💜");
    await loadAll();
    await searchPlayers();

  } catch (error) {
    say("Couldn't send request: " + errorMessage(error));
  }
}

async function respond(requestId, accept) {
  try {
    const { error } = await db.rpc("respond_to_friend_request", {
      p_request_id: requestId,
      p_accept: accept
    });

    if (error) throw error;

    say(accept
      ? "Friend request accepted! 💜"
      : "Friend request declined.");

    await loadAll();
  } catch (error) {
    say("Couldn't update request: " + errorMessage(error));
  }
}

async function cancelRequest(requestId) {
  try {
    const { error } = await db.rpc("cancel_friend_request", {
      p_request_id: requestId
    });

    if (error) throw error;

    say("Friend request cancelled.");
    await loadAll();
  } catch (error) {
    say("Couldn't cancel request: " + errorMessage(error));
  }
}

// Handle buttons rendered dynamically in the lists.
document.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button || button.disabled) return;

  button.disabled = true;

  const id = button.dataset.id;
  const action = button.dataset.action;

  if (action === "send") sendRequest(id);
  if (action === "cancel") cancelRequest(id);
  if (action === "respond") {
    respond(id, button.dataset.accept === "true");
  }
});

$("refreshButton").addEventListener("click", loadAll);
$("searchButton").addEventListener("click", searchPlayers);

$("searchInput").addEventListener("keydown", event => {
  if (event.key === "Enter") searchPlayers();
});

// Keep the page updated when login status changes.
db.auth.onAuthStateChange(() => {
  setTimeout(loadAll, 0);
});

loadAll();
</script>
</body>
</html>
