<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlitchBox Login</title>

<link rel="stylesheet" href="css/styles.css">

<script src="js/app.js" defer></script>

<style>

.login-box{

width:420px;

max-width:95%;

margin:80px auto;

background:var(--card);

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:0 0 25px rgba(124,58,237,.35);

}

.logo{

font-size:42px;

font-weight:bold;

color:var(--purple-light);

margin-bottom:15px;

}

.subtitle{

color:var(--text2);

margin-bottom:30px;

}

input{

width:100%;

padding:15px;

margin-bottom:18px;

border:none;

border-radius:12px;

background:#1b1b30;

color:white;

font-size:16px;

}

input:focus{

outline:2px solid var(--purple);

}

button{

width:100%;

padding:15px;

background:var(--purple);

color:white;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

button:hover{

background:#8b5cf6;

transform:translateY(-2px);

}

.links{

margin-top:20px;

}

.links a{

color:var(--purple-light);

text-decoration:none;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
🎮 GLITCHBOX
</div>

<div class="subtitle">
Enter the Glitch. Own the Game.
</div>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<div class="links">

<br>

<a href="signup.html">
Create Account
</a>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const username=document.getElementById("username").va
lue;

login(username,"Player");

window.location.href="index.html";

});

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const username = document.getElementById("username").value;

    const password = document.getElementById("password").value;

    // Temporary login (real login comes later)
    login(username,"Player");

    // Remember username
    localStorage.setItem("gb_username", username);

    // First time on this device?
    if(localStorage.getItem("gb_device")==null){

        window.location.href="device-setup.html";

    }else{

        window.location.href="index.html";

    }

});

</script>

</body>
</html>
